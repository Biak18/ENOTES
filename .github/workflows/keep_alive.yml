name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 * * 0,5'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -fsS -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/sys_menu?select=cd_menu&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ROLE }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ROLE }}"
